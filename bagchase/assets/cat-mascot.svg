<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-labelledby="catTitle">
  <title id="catTitle">Ponscat watching the charts</title>
  <defs>
    <linearGradient id="screenGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1ef07a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0a3d24" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="catBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3f4b"/>
      <stop offset="100%" stop-color="#22252c"/>
    </linearGradient>
  </defs>

  <!-- monitor -->
  <rect x="70" y="70" width="260" height="170" rx="14" fill="#101319" stroke="#2c313c" stroke-width="4"/>
  <rect x="86" y="86" width="228" height="138" rx="6" fill="url(#screenGlow)"/>
  <!-- candlesticks -->
  <g stroke="#eafff2" stroke-width="3">
    <line x1="110" y1="190" x2="110" y2="150"/>
    <line x1="140" y1="205" x2="140" y2="140"/>
    <line x1="170" y1="215" x2="170" y2="120"/>
    <line x1="200" y1="200" x2="200" y2="110"/>
    <line x1="230" y1="190" x2="230" y2="95"/>
    <line x1="260" y1="180" x2="260" y2="105"/>
    <line x1="290" y1="170" x2="290" y2="80"/>
  </g>
  <g fill="#0a3d24" stroke="#eafff2" stroke-width="2">
    <rect x="104" y="160" width="12" height="25"/>
    <rect x="134" y="150" width="12" height="45"/>
    <rect x="164" y="135" width="12" height="60"/>
    <rect x="194" y="120" width="12" height="65"/>
    <rect x="224" y="105" width="12" height="70"/>
    <rect x="254" y="115" width="12" height="55"/>
    <rect x="284" y="90" width="12" height="70"/>
  </g>
  <!-- monitor stand -->
  <rect x="185" y="240" width="30" height="20" fill="#2c313c"/>
  <rect x="150" y="258" width="100" height="12" rx="6" fill="#2c313c"/>

  <!-- cat body -->
  <ellipse cx="200" cy="345" rx="95" ry="55" fill="url(#catBody)"/>
  <!-- cat head -->
  <circle cx="200" cy="300" r="58" fill="url(#catBody)"/>
  <!-- ears -->
  <polygon points="150,270 165,215 190,265" fill="#22252c"/>
  <polygon points="250,270 235,215 210,265" fill="#22252c"/>
  <polygon points="156,262 166,228 182,258" fill="#3a3f4b"/>
  <polygon points="244,262 234,228 218,258" fill="#3a3f4b"/>

  <!-- sunglasses -->
  <g>
    <rect x="160" y="292" width="35" height="20" rx="8" fill="#0b0d11" stroke="#1ef07a" stroke-width="2"/>
    <rect x="205" y="292" width="35" height="20" rx="8" fill="#0b0d11" stroke="#1ef07a" stroke-width="2"/>
    <line x1="195" y1="300" x2="205" y2="300" stroke="#1ef07a" stroke-width="2"/>
    <line x1="160" y1="298" x2="145" y2="292" stroke="#1ef07a" stroke-width="2"/>
    <line x1="240" y1="298" x2="255" y2="292" stroke="#1ef07a" stroke-width="2"/>
  </g>

  <!-- nose + mouth -->
  <path d="M195 322 L205 322 L200 330 Z" fill="#1ef07a"/>
  <path d="M200 330 Q190 340 178 334" stroke="#0b0d11" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M200 330 Q210 340 222 334" stroke="#0b0d11" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- whiskers -->
  <g stroke="#0b0d11" stroke-width="2" opacity="0.6">
    <line x1="130" y1="310" x2="170" y2="315"/>
    <line x1="130" y1="322" x2="170" y2="322"/>
    <line x1="270" y1="310" x2="230" y2="315"/>
    <line x1="270" y1="322" x2="230" y2="322"/>
  </g>

  <!-- tail -->
  <path d="M290 380 Q345 370 335 320 Q330 300 305 305" stroke="#22252c" stroke-width="22" fill="none" stroke-linecap="round"/>
</svg>
